<svg viewBox="0 0 700 880" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect width="700" height="880" fill="#ffffff"/>

  <!-- Cliente -->
  <rect x="200" y="20" width="300" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="15" fill="#1e1b4b" font-weight="600">Cliente / Swagger UI</text>
  <text x="350" y="65" text-anchor="middle" font-size="13" fill="#4338ca">ou Front-end (Streamlit)</text>
  <line x1="350" y1="80" x2="350" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- router.py -->
  <rect x="200" y="120" width="300" height="60" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="350" y="145" text-anchor="middle" font-size="15" fill="#164e63" font-weight="600">router.py</text>
  <text x="350" y="165" text-anchor="middle" font-size="13" fill="#0891b2">rotas HTTP</text>

  <!-- branch lines -->
  <line x1="350" y1="180" x2="350" y2="210" stroke="#4a5568" stroke-width="2"/>
  <line x1="180" y1="210" x2="520" y2="210" stroke="#4a5568" stroke-width="2"/>
  <line x1="180" y1="210" x2="180" y2="240" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="210" x2="520" y2="240" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- schema.py -->
  <rect x="30" y="240" width="300" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="265" text-anchor="middle" font-size="15" fill="#14532d" font-weight="600">schema.py</text>
  <text x="180" y="285" text-anchor="middle" font-size="13" fill="#16a34a">validação Pydantic</text>

  <!-- crud.py -->
  <rect x="370" y="240" width="300" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="520" y="265" text-anchor="middle" font-size="15" fill="#7c2d12" font-weight="600">crud.py</text>
  <text x="520" y="285" text-anchor="middle" font-size="13" fill="#ea580c">operações no banco</text>

  <line x1="520" y1="300" x2="520" y2="330" stroke="#4a5568" stroke-width="2"/>
  <line x1="520" y1="330" x2="350" y2="330" stroke="#4a5568" stroke-width="2"/>
  <line x1="350" y1="330" x2="350" y2="360" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- models.py -->
  <rect x="200" y="360" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="385" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="600">models.py</text>
  <text x="350" y="405" text-anchor="middle" font-size="13" fill="#dc2626">tabela ORM</text>
  <line x1="350" y1="420" x2="350" y2="460" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- database.py -->
  <rect x="200" y="460" width="300" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="485" text-anchor="middle" font-size="15" fill="#4c1d95" font-weight="600">database.py</text>
  <text x="350" y="505" text-anchor="middle" font-size="13" fill="#7c3aed">engine e sessão</text>
  <line x1="350" y1="520" x2="350" y2="560" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- config.py -->
  <rect x="200" y="560" width="300" height="60" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="585" text-anchor="middle" font-size="15" fill="#713f12" font-weight="600">config.py</text>
  <text x="350" y="605" text-anchor="middle" font-size="13" fill="#ca8a04">settings via .env</text>
  <line x1="350" y1="620" x2="350" y2="660" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="200" y="660" width="300" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="350" y="695" text-anchor="middle" font-size="16" fill="#0c4a6e" font-weight="700">PostgreSQL</text>

  <text x="350" y="760" text-anchor="middle" font-size="12" fill="#94a3b8">Diagrama de arquitetura — projeto CRUD de Produtos</text>
</svg>
